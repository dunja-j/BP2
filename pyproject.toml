[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-cost-estimator"
version = "1.0.0"
description = "Estimator troska i optimizer fizickih planova za ograniceni SQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
sql-cost-estimator = "sql_cost_estimator.cli:main"

[tool.setuptools.packages.find]
include = ["sql_cost_estimator*"]

[tool.setuptools.package-data]
sql_cost_estimator = ["input.schema.json"]
